[workspace]
members = [
    "crates/libmsa",
    "crates/salti",
]
resolver = "3"
default-members = ["crates/salti"]

[workspace.lints.clippy]
pedantic = "warn"
mod_module_files = "warn"

[profile.release]
debug = true

[profile.dist]
inherits = "release"
incremental = false
codegen-units = 1
lto = true
debug = false
